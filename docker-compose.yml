# Open-source Studio OS stack
# Uses local ComfyUI + Wan 2.2 (no paid APIs)
# Run ComfyUI separately on the host (port 8188) with Wan 2.2 models loaded.

version: "3.8"

services:
  api:
    build: .
    command: uvicorn studio_os.interfaces.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./characters:/app/characters
      - ./renders:/app/renders
      - ./series_continuity:/app/series_continuity
    environment:
      - COMFYUI_URL=http://host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: python -m studio_os.worker
    volumes:
      - ./characters:/app/characters
      - ./renders:/app/renders
      - ./series_continuity:/app/series_continuity
      - ./models:/app/models
    environment:
      - COMFYUI_URL=http://host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Uncomment for GPU passthrough if ComfyUI is also containerized
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional: run ComfyUI in the same compose (requires models volume)
  # comfyui:
  #   image: yanwk/comfyui-boot:latest
  #   ports:
  #     - "8188:8188"
  #   volumes:
  #     - ./models:/root/ComfyUI/models
  #     - ./renders:/root/ComfyUI/output
