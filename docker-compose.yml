# Studio OS — shared job store between API and worker
# ComfyUI + Wan 2.2 must run on the host (port 8188).

version: "3.8"

services:
  api:
    build: .
    command: uvicorn studio_os.interfaces.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./characters:/app/characters
      - ./renders:/app/renders
      - ./series_continuity:/app/series_continuity
      - ./job_store:/app/job_store
      - ./workflows:/app/workflows
    environment:
      - COMFYUI_URL=http://host.docker.internal:8188
      - JOB_STORE_DIR=/app/job_store
      - RENDERS_DIR=/app/renders
      - API_WORKERS=2
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: python -m studio_os.worker
    volumes:
      - ./characters:/app/characters
      - ./renders:/app/renders
      - ./series_continuity:/app/series_continuity
      - ./job_store:/app/job_store
      - ./models:/app/models
      - ./workflows:/app/workflows
    environment:
      - COMFYUI_URL=http://host.docker.internal:8188
      - JOB_STORE_DIR=/app/job_store
      - RENDERS_DIR=/app/renders
      - NUM_WORKERS=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
