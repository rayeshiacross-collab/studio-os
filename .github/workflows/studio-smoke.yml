name: Studio OS startup smoke test
on:
  # Owner hold: service startup must be explicitly requested, never triggered by repair commits.
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot services
        run: |
          docker compose up -d --build
          docker compose ps
      - name: Check API and workflow packaging
        run: |
          set -eu
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python -c 'import json; assert json.load(open("/tmp/health.json"))["status"]=="ok"'
          docker compose exec -T api test -s /app/workflows/wan22_character_locked_t2v.json
          curl --fail --silent -X POST http://localhost:8000/characters -H 'Content-Type: application/json' -d '{"id":"smoke","name":"Smoke Character","trigger_word":"smoke"}' | tee /tmp/character.json
          python -c 'import json; assert json.load(open("/tmp/character.json"))["registered"] is True'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Shut down
        if: always()
        run: docker compose down
