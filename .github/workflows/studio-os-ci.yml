name: Studio OS CI
on:
  push:
    branches: [main, fix/api-job-status-health-20261023]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Install fixture media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify fixture media tools
        run: command -v ffmpeg && command -v ffprobe
      - name: Compile Python modules
        run: python -m compileall -q studio_os
      - name: Run regression tests
        run: python -m pytest -q tests
